name: Validate Romisaa static demo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Verify page assets and internal links
        run: python3 tests/static_check.py
