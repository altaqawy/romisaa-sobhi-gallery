name: Static website quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for f in assets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: HTML pages and local assets
        run: python3 scripts/check_static.py
      - name: Verify V5 is a local demo
        run: |
          grep -q "BROWSER-ONLY DEMONSTRATION" assets/v5-desk.js
          grep -q "بيانات وهمية" atelier-desk.html
          test -f docs/V5_ARCHITECTURE.md
